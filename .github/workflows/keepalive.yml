name: Render Keepalive (backup)

# PRIMARY keepalive is the Cloudflare Worker (keepalive-worker/wrangler.toml).
# That worker fires reliably and waits 90s — long enough for Render's ~50s cold start.
#
# This GitHub Actions workflow is the BACKUP. It covers two windows the
# Cloudflare free plan's 5-trigger limit couldn't fit:
#   (none currently)
# It duplicates the primary windows so a GitHub delay is caught by CF and vice versa.
#
# GitHub Actions schedule is BEST-EFFORT — can be delayed 5–30+ min under load.
# Minutes are offset off :00/:05/:10 to reduce drop rate (see GitHub docs).
#
# All times UTC. IST = UTC+5:30. ET = UTC-4 (EDT) / UTC-5 (EST) — US windows must cover both.

on:
  schedule:
    # 1. NSE full trading day, no gap: 3:00–10:57 UTC Mon–Fri (08:30–16:27 IST)
    #    Merged from separate morning/evening windows to close the midday gap
    #    (11:27-14:30 IST) that let Render sleep through the trading session.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 3-10 * * 1-5'

    # 3a. US pre-open warmup: 12:47–12:57 UTC Mon–Fri
    - cron: '47,52,57 12 * * 1-5'
    # 3b. US market: 13:00–15:57 UTC Mon–Fri
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 13-15 * * 1-5'

    # 4. US EOD bracket: 20:02–21:52 UTC Mon–Fri — covers 16:05 ET in both EDT and EST
    - cron: '2,12,22,32,42,52 20-21 * * 1-5'

    # 5. Weekly LT scan: 18:02–20:57 UTC Saturday (Sun 00:00–02:27 IST)
    #    Must outlast the scan itself, not just its start — see wrangler.toml.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 18-20 * * 6'

  # Manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          echo "Keepalive ping at $(date -u)"
          curl --max-time 90 --retry 3 --retry-delay 10 \
               --silent --show-error \
               https://nse-proxy-mojx.onrender.com/ping
          echo ""
          echo "Done at $(date -u)"
