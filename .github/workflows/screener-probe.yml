name: Screener probe (temporary)

# One-off check that Screener.in answers from GitHub-hosted runners before the
# weekly long-term scan is moved here. Safe to delete once that move is done.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch a few Screener pages
        run: |
          python3 - <<'PY'
          import re, time, urllib.request
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/120 Safari/537.36",
               "Accept-Language": "en-US,en;q=0.9"}
          ok = 0
          syms = ["TITAN", "TCS", "HDFCBANK", "COFORGE", "KARURVYSYA", "NYKAA", "IIFL", "SKIPPER"]
          for s in syms:
              try:
                  req = urllib.request.Request(f"https://www.screener.in/company/{s}/consolidated/", headers=H)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read().decode("utf-8", "replace")
                  pe = re.search(r'Stock P/E.{0,400}?<span class="number">([\d,.\-]+)</span>', body, re.S)
                  roe = re.search(r'>\s*ROE\s*<.{0,400}?<span class="number">([\d,.\-]+)</span>', body, re.S)
                  print(f"{s:12} HTTP {r.status}  {len(body):7} bytes  P/E={pe.group(1) if pe else None}  ROE={roe.group(1) if roe else None}")
                  ok += bool(pe)
              except Exception as e:
                  print(f"{s:12} FAILED: {getattr(e, 'code', '')} {e}")
              time.sleep(2)
          print(f"\nRESULT: {ok}/{len(syms)} pages returned a P/E")
          PY
